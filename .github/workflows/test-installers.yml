name: Test installers

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unix:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Test installation and safe reinstallation
        run: ./tests/install-obsidian-ai-memory.test.sh

  windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate templates
        shell: pwsh
        run: ./tests/Validate-Templates.ps1

      - name: Test installation and safe reinstallation
        shell: pwsh
        run: ./tests/Install-ObsidianAIMemory.Tests.ps1
