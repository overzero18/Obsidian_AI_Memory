name: Build release bundle

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create portable archive
        run: |
          git archive --format=zip --output="obsidian-ai-memory-${GITHUB_REF_NAME}.zip" HEAD
          sha256sum "obsidian-ai-memory-${GITHUB_REF_NAME}.zip" > "obsidian-ai-memory-${GITHUB_REF_NAME}.zip.sha256"
          cp "obsidian-ai-memory-${GITHUB_REF_NAME}.zip" obsidian-ai-memory.zip
          sha256sum obsidian-ai-memory.zip > obsidian-ai-memory.zip.sha256

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "obsidian-ai-memory-${GITHUB_REF_NAME}.zip" \
            "obsidian-ai-memory-${GITHUB_REF_NAME}.zip.sha256" \
            obsidian-ai-memory.zip \
            obsidian-ai-memory.zip.sha256 \
            --generate-notes
